name: Release CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            output: Bin/Release (lite)
            arm64: false

          - platform: x64
            output: Bin/x64/Release (lite)
            arm64: false

          - platform: ARM64EC
            output: Bin/ARM64EC/Release (lite)
            arm64: true

    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio not found."
          }

          echo "path=$vs" >> $env:GITHUB_OUTPUT

      - name: Install Visual Studio Components
        shell: pwsh
        run: |
          $args = @(
            "modify",
            "--installPath","${{ steps.vs.outputs.path }}",

            "--add","Microsoft.VisualStudio.Workload.NativeDesktop",

            "--add","Microsoft.VisualStudio.ComponentGroup.VC.Tools.143.x86.x64",
            "--add","Microsoft.VisualStudio.Component.VC.ATLMFC",

            "--includeRecommended",
            "--includeOptional",

            "--passive",
            "--norestart"
          )

          if ("${{ matrix.arm64 }}" -eq "true") {
            $args += "--add"
            $args += "Microsoft.VisualStudio.Component.VC.Tools.ARM64"

            $args += "--add"
            $args += "Microsoft.VisualStudio.Component.VC.MFC.ARM64"
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $args `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "VS Installer failed: $($process.ExitCode)"
          }

      - name: Verify MFC
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "${{ steps.vs.outputs.path }}\VC\Tools\MSVC" |
            Sort-Object Name -Descending |
            Select-Object -First 1

          Get-ChildItem $msvc.FullName

          if (-not (Test-Path "$($msvc.FullName)\atlmfc")) {
            throw "MFC folder not found."
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild TrafficMonitor_Lite.sln
          -m
          -p:Configuration="Release (lite)"
          -p:Platform=${{ matrix.platform }}
          -p:PlatformToolset=v143

      - uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYYMMDD_HHmmss
          utcOffset: "+08:00"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
          path: |
            ${{ matrix.output }}/TrafficMonitor.exe
            ${{ matrix.output }}/*.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}_${{ steps.current-time.outputs.formattedTime }}_pdb
          path: |
            ${{ matrix.output }}/*.pdb
